name: Media

# Started by hand, from the Actions tab. Nothing reaches mod.io because a branch moved - the
# folder assets/media is the gallery that will be uploaded, and when it goes up is a separate
# decision, the same way a release is.
#
# The steps live in YoloDevDE/zeepkist-build.
on:
  workflow_dispatch:

jobs:
  media:
    uses: YoloDevDE/zeepkist-build/.github/workflows/media.yml@v1
    with:
      modio-mod-id: ${{ vars.MODIO_MOD_ID }}
    secrets: inherit
