name: CI

# Catches a broken build while it is still cheap: on every push to the branch the work happens
# on, and again on the pull request that would carry it into `main`.
#
# The steps live in YoloDevDE/zeepkist-build, so a change to them is one edit rather than six.
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    uses: YoloDevDE/zeepkist-build/.github/workflows/ci.yml@v1
